<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Continue</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .image {
            display: block;
            width: auto;
            height: auto;
            max-width: min(100%, 1035px);
            max-height: 74.75vh;
            max-height: 74.75dvh;
            object-fit: contain;
            object-position: center;
        }

        .timer-container {
            display: none;
            align-items: center;
            gap: 14px;
            font-size: 17px;
            color: #404145;
        }

        .clock {
            width: 34px;
            height: 34px;
            border: 3px solid #1dbf73;
            border-radius: 50%;
            position: relative;
        }

        .clock::after {
            content: "";
            position: absolute;
            width: 3px;
            height: 12px;
            background: #1dbf73;
            left: 13px;
            top: 3px;
            transform-origin: bottom center;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .continue-btn {
            display: block;
            width: min(100%, 400px);
            padding: 17px 24px;
            background: #1dbf73;
            color: #ffffff;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .continue-btn:hover {
            background: #19a463;
        }

        .continue-btn:focus-visible {
            outline: 3px solid #126e46;
            outline-offset: 3px;
        }

        .destination {
            font-size: 12px;
            color: #666666;
            text-align: center;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            .page {
                padding: 14px;
                gap: 16px;
            }

            .image {
                max-width: 100%;
                max-height: 65dvh;
            }
        }
    </style>
</head>
